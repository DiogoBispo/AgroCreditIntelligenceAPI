# Ruleset do MCR 2-9 (Impedimentos Sociais, Ambientais e Climáticos do crédito rural).
#
# Base: texto oficial da Seção 9 do Capítulo 2 do MCR, Atualização MCR nº 756, de 15/05/2026
# (Res. CMN 5.193/2024, 5.268/2025 e 5.303/2026), publicado pelo Banco Central / gov.br.
#
# revisao_juridica: NAO_REALIZADA — as regras seguem a leitura técnica do texto oficial, com a citação do item
# em cada uma, mas não passaram por parecer jurídico. Exceções que dependem de documento do mutuário
# (plano de manejo, pertencimento a povo indígena ou quilombola, matrícula, PRAD, ASV etc.) não são
# verificáveis em bases públicas: aparecem no motivo do resultado para a instituição financeira avaliar.
#
# obrigatoria: true  -> NAO_VERIFICADO nesta regra torna o parecer INCONCLUSIVO (impedimento do MCR).
# obrigatoria: false -> regra informativa, fora dos impedimentos do MCR (ou ainda não exigível).

versoes:
  - id: "MCR-2-9@2026-05-15"
    vigencia_inicio: 2026-05-15
    vigencia_fim: null
    revisao_juridica: NAO_REALIZADA
    regras:
      R-CAR:
        fundamento: "MCR 2-9 itens 2 e 3"
        obrigatoria: true
      R-MTE:
        fundamento: "MCR 2-9 item 4"
        obrigatoria: true
      R-EMB-GEO:
        # Embargo de área por desmatamento ilegal, registrado na lista do IBAMA. Exceções documentais nos
        # itens 11 e 12; CAR coletivo (item 13) sai como ALERTA.
        fundamento: "MCR 2-9 itens 10 a 13"
        obrigatoria: true
      R-EMB-EST:
        # Informativo: o item 10 só alcança embargos registrados na lista do IBAMA.
        fundamento: "Informativo (MCR 2-9 item 10 exige registro na lista do IBAMA)"
        obrigatoria: false
      R-EMB-DOC:
        # Informativo: o item 10 trata do embargo no imóvel; histórico do tomador pesa no item 12, b.
        fundamento: "Informativo (MCR 2-9 item 12, b)"
        obrigatoria: false
        tipos_documento_verificaveis: [CPF, CNPJ]  # IBAMA publica os dois sem máscara (Fase 0)
      R-EMB-SEMGEO:
        fundamento: "Informativo (MCR 2-9 item 10)"
        obrigatoria: false
      R-TI:
        fundamento: "MCR 2-9 item 7"
        obrigatoria: true
        # Item 7, a: "homologadas, regularizadas ou definidas como Reserva Indígena" no sistema da Funai.
        # ENCAMINHADA_RI = homologada em registro imobiliário. Fases anteriores (declarada etc.) geram ALERTA.
        fases_impeditivas: [HOMOLOGADA, ENCAMINHADA_RI, REGULARIZADA]
        modalidades_impeditivas: [RESERVA_INDIGENA]
      R-UC:
        fundamento: "MCR 2-9 itens 5 e 6"
        obrigatoria: true
        # Item 6: em UC de domínio exclusivamente público, o impedimento depende de regularização fundiária
        # concluída, que as bases públicas não informam: essas categorias geram ALERTA (Lei 9.985/2000:
        # ESEC art. 9, REBIO art. 10, Parque art. 11, Floresta art. 17, RESEX art. 18, REFAU art. 19,
        # RDS art. 20). As demais (APA, ARIE, MONA, RVS, RPPN) admitem terra privada: impedimento do item 5.
        categorias_dominio_publico: [ESEC, REBIO, PARQUE, FLORESTA, RESEX, REFAU, RDS]
      R-QUI:
        fundamento: "MCR 2-9 itens 8 e 9"
        obrigatoria: true
        # Item 8: "terras tituladas, ou com título parcial". Fases na fonte (INCRA): RTID, PORTARIA, DECRETO,
        # TITULO_PARCIAL, TITULADO, CCDRU, TITULO_ANULADO.
        fases_impeditivas: [TITULADO, TITULO_PARCIAL]
      R-FPND:
        fundamento: "MCR 2-9 itens 14 e 15"
        obrigatoria: true
        tipos_impeditivos: [B]
      R-PRODES:
        # Item 17: exigência começa por porte do imóvel; até lá, informativo. Sempre ALERTA (o item 18
        # condiciona o crédito a documento, não o veda).
        fundamento: "MCR 2-9 itens 17 e 18"
        obrigatoria: false
        data_corte: 2019-07-31
        inicio_exigencia:
          acima_15_mf: 2027-01-04
          de_4_a_15_mf: 2027-07-01
          ate_4_mf: 2028-01-03  # também CAR coletivo (item 17-A)
      R-RFB:
        fundamento: "Informativo (fora do MCR 2-9)"
        obrigatoria: false
