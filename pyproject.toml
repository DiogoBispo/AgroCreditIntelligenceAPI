[project]
name = "agrocredit"
version = "0.1.0"
description = "AgroCredit Intelligence API — verificação de impedimentos do MCR 2-9 para crédito rural"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "prometheus-client>=0.20",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/DiogoBispo/AgroCreditIntelligenceAPI"
Documentation = "https://github.com/DiogoBispo/AgroCreditIntelligenceAPI/tree/main/documents"

[project.optional-dependencies]
pipeline = [
    "duckdb>=1.1",
    "geopandas>=1.0",
    "polars>=1.6",
    "pyogrio>=0.9",
    "pyproj>=3.6",
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "bandit>=1.7",
    "httpx>=0.27",
    "mypy>=1.11",
    "pandas-stubs>=3.0.5.260914",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-geopandas>=1.1.4.20261006",
    "types-pyyaml>=6.0",
    "types-shapely>=2.1.0.20260728",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agrocredit"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C90", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos em português com acentos

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Nomes de tabela não são parametrizáveis: base/fonte/versão passam por allowlist e regex
# (gold.validar_identificadores) antes de entrar no SQL.
"src/agrocredit/pipeline/gold.py" = ["S608"]
# Idem: partições validadas por regex e tabelas de versão por validar_identificadores
"src/agrocredit/manutencao/tarefas.py" = ["S608"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["agrocredit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: exige PostGIS (DATABASE_URL)",
]
